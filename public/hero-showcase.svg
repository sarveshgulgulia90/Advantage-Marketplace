<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" width="100%" height="100%">
  <defs>
    <linearGradient id="glow_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0b1f5e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hero_screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="30%" stop-color="#2563eb"/>
      <stop offset="70%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="hero_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="card_shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Ambient Glow Behind -->
  <circle cx="280" cy="200" r="160" fill="url(#glow_grad)"/>

  <!-- Main Hero Laptop -->
  <g filter="url(#card_shadow)">
    <!-- Screen Lid -->
    <rect x="110" y="50" width="310" height="200" rx="12" fill="#090d16" stroke="#38bdf8" stroke-width="2"/>
    <!-- Screen Bezel -->
    <rect x="116" y="56" width="298" height="188" rx="8" fill="#020617"/>
    <!-- Camera Notch -->
    <rect x="250" y="57" width="20" height="4" rx="2" fill="#1e293b"/>
    <circle cx="260" cy="59" r="1.5" fill="#38bdf8"/>
    <!-- Screen Display Wallpaper -->
    <rect x="122" y="68" width="286" height="168" rx="4" fill="url(#hero_screen)"/>
    <!-- Screen Graphic Highlights -->
    <circle cx="320" cy="130" r="50" fill="#ffffff" opacity="0.2"/>
    <path d="M140 180 Q 220 100, 320 150 T 390 110" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.4"/>
    <rect x="122" y="218" width="286" height="18" fill="#090d16" opacity="0.9"/>
    <circle cx="265" cy="227" r="4" fill="#38bdf8"/>
    <circle cx="280" cy="227" r="4" fill="#818cf8"/>
    <circle cx="295" cy="227" r="4" fill="#ec4899"/>

    <!-- Base / Keyboard Deck -->
    <polygon points="60,310 460,310 420,250 100,250" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <!-- Keyboard Area with RGB glow -->
    <polygon points="115,290 405,290 385,255 135,255" fill="#020617" stroke="#3b82f6" stroke-width="0.8"/>
    <g fill="#1e293b" stroke="#06b6d4" stroke-width="0.3">
      <rect x="140" y="258" width="240" height="5" rx="1"/>
      <rect x="135" y="266" width="250" height="6" rx="1"/>
      <rect x="130" y="275" width="260" height="7" rx="1"/>
      <rect x="125" y="284" width="270" height="4" rx="1"/>
    </g>
    <!-- Touchpad -->
    <rect x="235" y="293" width="70" height="14" rx="3" fill="#1e293b" stroke="#64748b" stroke-width="0.8"/>
    <path d="M60 310 L460 310 C460 318 440 322 430 322 L90 322 C80 322 60 318 60 310 Z" fill="#090d16"/>
  </g>

  <!-- Floating Trust Badge 1: Since 1995 (Left) -->
  <g transform="translate(20, 90)" filter="url(#card_shadow)">
    <rect x="0" y="0" width="165" height="64" rx="10" fill="#0b1f5e" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    <circle cx="32" cy="32" r="18" fill="#cc1a1a"/>
    <text x="32" y="37" font-family="'DM Sans',sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">30+</text>
    <text x="60" y="26" font-family="'DM Sans',sans-serif" font-size="12" font-weight="800" fill="#ffffff">YEARS TRUST</text>
    <text x="60" y="44" font-family="'DM Sans',sans-serif" font-size="10" font-weight="600" fill="rgba(255,255,255,0.7)">In Silchar Since 1995</text>
  </g>

  <!-- Floating Trust Badge 2: Official Dealer (Right) -->
  <g transform="translate(360, 60)" filter="url(#card_shadow)">
    <rect x="0" y="0" width="160" height="66" rx="10" fill="#ffffff" stroke="rgba(11,31,94,0.15)" stroke-width="1.5"/>
    <circle cx="30" cy="33" r="16" fill="#16a34a"/>
    <text x="30" y="38" font-family="'DM Sans',sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">✓</text>
    <text x="56" y="27" font-family="'DM Sans',sans-serif" font-size="11" font-weight="800" fill="#0b1f5e">AUTHORISED</text>
    <text x="56" y="44" font-family="'DM Sans',sans-serif" font-size="9" font-weight="700" fill="#64748b">HP · Dell · Lenovo · Asus</text>
  </g>

  <!-- Floating Trust Badge 3: Same Day Repair (Bottom Right) -->
  <g transform="translate(340, 275)" filter="url(#card_shadow)">
    <rect x="0" y="0" width="180" height="60" rx="10" fill="#0b1f5e" stroke="#cc1a1a" stroke-width="1.5"/>
    <circle cx="28" cy="30" r="14" fill="#cc1a1a"/>
    <text x="28" y="35" font-family="'DM Sans',sans-serif" font-size="13" font-weight="900" fill="#fff" text-anchor="middle">⚡</text>
    <text x="52" y="25" font-family="'DM Sans',sans-serif" font-size="11" font-weight="800" fill="#ffffff">EXPRESS SERVICE</text>
    <text x="52" y="42" font-family="'DM Sans',sans-serif" font-size="9" font-weight="600" fill="rgba(255,255,255,0.7)">Anand Arcade, Silchar</text>
  </g>
</svg>