<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="laser_body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>
  <ellipse cx="200" cy="265" rx="140" ry="12" fill="#0b1f5e" opacity="0.14"/>
  <g>
    <!-- Main Compact Laser Body -->
    <rect x="80" y="105" width="240" height="140" rx="12" fill="url(#laser_body)" stroke="#94a3b8" stroke-width="2"/>
    <!-- Top Recessed Output Bin -->
    <rect x="100" y="85" width="200" height="35" rx="5" fill="#334155"/>
    <circle cx="200" cy="135" r="14" fill="#0284c7"/>
    <text x="200" y="140" font-family="sans-serif" font-size="12" font-weight="900" fill="#fff" text-anchor="middle">hp</text>
    <!-- Power & Status Buttons -->
    <circle cx="295" cy="135" r="5" fill="#22c55e"/>
    <circle cx="295" cy="150" r="5" fill="#f59e0b"/>
    <!-- Paper Feed Tray Folded -->
    <rect x="100" y="210" width="200" height="25" rx="4" fill="#64748b" stroke="#475569" stroke-width="1"/>
    <text x="200" y="226" font-family="sans-serif" font-size="8" font-weight="700" fill="#f8fafc" text-anchor="middle">HP Laser 107a</text>
  </g>
</svg>