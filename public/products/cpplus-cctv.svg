<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="dome_glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <ellipse cx="200" cy="265" rx="110" ry="12" fill="#0b1f5e" opacity="0.16"/>
  <g>
    <!-- Ceiling Mount Base Ring -->
    <rect x="90" y="55" width="220" height="30" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="200" y="75" font-family="sans-serif" font-size="11" font-weight="900" fill="#dc2626" text-anchor="middle" letter-spacing="1">CP PLUS</text>
    <!-- Camera Body Turret -->
    <path d="M110 85 L290 85 C290 145 270 190 200 190 C130 190 110 145 110 85 Z" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Dome Glass Eye -->
    <circle cx="200" cy="155" r="55" fill="url(#dome_glass)" stroke="#334155" stroke-width="2"/>
    <!-- Infrared LEDs Ring -->
    <circle cx="200" cy="155" r="42" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,6" opacity="0.8"/>
    <!-- Center Optical Lens -->
    <circle cx="200" cy="155" r="22" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="194" cy="149" r="6" fill="#ffffff" opacity="0.6"/>
    <!-- Spec Badge -->
    <rect x="140" y="215" width="120" height="24" rx="4" fill="#0b1f5e"/>
    <text x="200" y="231" font-family="sans-serif" font-size="10" font-weight="800" fill="#fff" text-anchor="middle">2MP HD · IR Night Vision</text>
  </g>
</svg>