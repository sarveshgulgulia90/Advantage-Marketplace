<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="hdd_body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <ellipse cx="200" cy="265" rx="110" ry="12" fill="#0b1f5e" opacity="0.16"/>
  <g>
    <!-- Hard Drive Body -->
    <rect x="130" y="45" width="140" height="210" rx="10" fill="url(#hdd_body)" stroke="#475569" stroke-width="2"/>
    <!-- Brushed Texture Stripes -->
    <g stroke="#334155" stroke-width="1">
      <line x1="145" y1="70" x2="255" y2="70"/>
      <line x1="145" y1="90" x2="255" y2="90"/>
      <line x1="145" y1="110" x2="255" y2="110"/>
      <line x1="145" y1="130" x2="255" y2="130"/>
    </g>
    <!-- LED Activity Light -->
    <circle cx="150" cy="65" r="3" fill="#38bdf8"/>
    <!-- Seagate Wave Logo / Text -->
    <text x="200" y="210" font-family="sans-serif" font-size="16" font-weight="900" fill="#cbd5e1" text-anchor="middle" letter-spacing="1">SEAGATE</text>
    <text x="200" y="228" font-family="sans-serif" font-size="9" font-weight="700" fill="#38bdf8" text-anchor="middle">1TB Expansion Portable</text>
    <rect x="180" y="253" width="40" height="6" rx="2" fill="#020617"/>
  </g>
</svg>