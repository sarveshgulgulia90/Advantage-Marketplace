<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="hp_mon_screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="40%" stop-color="#8b5cf6"/>
      <stop offset="80%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <ellipse cx="200" cy="275" rx="140" ry="10" fill="#0b1f5e" opacity="0.16"/>
  <g>
    <!-- Sleek Silver Base -->
    <polygon points="150,268 250,268 240,262 160,262" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="195" y="190" width="10" height="75" fill="#94a3b8"/>
    <!-- Ultra-Slim Monitor Frame (Micro-edge 3 sides) -->
    <rect x="45" y="25" width="310" height="185" rx="4" fill="#020617" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="48" y="28" width="304" height="170" fill="url(#hp_mon_screen)"/>
    <!-- Chin with HP logo -->
    <rect x="45" y="198" width="310" height="12" fill="#e2e8f0"/>
    <circle cx="200" cy="204" r="4.5" fill="#0284c7"/>
    <text x="200" y="206.5" font-family="sans-serif" font-size="4" font-weight="900" fill="#fff" text-anchor="middle">hp</text>
  </g>
</svg>