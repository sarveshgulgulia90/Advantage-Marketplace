<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="tower_body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="pc_shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0b1f5e" flood-opacity="0.25"/>
    </filter>
  </defs>
  <ellipse cx="200" cy="270" rx="120" ry="12" fill="#0b1f5e" opacity="0.18"/>
  <g filter="url(#pc_shadow)">
    <!-- Tower Main Chassis -->
    <rect x="125" y="30" width="150" height="235" rx="8" fill="url(#tower_body)" stroke="#475569" stroke-width="2"/>
    <!-- Front Bezel Pattern -->
    <rect x="135" y="40" width="130" height="215" rx="4" fill="#090d16"/>
    <!-- Optical Drive Slot / Line -->
    <rect x="145" y="55" width="110" height="18" rx="2" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="245" cy="64" r="2" fill="#64748b"/>
    <!-- Power Button with Blue LED Glow -->
    <circle cx="200" cy="92" r="7" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="200" cy="92" r="4" fill="#3b82f6"/>
    <!-- Front I/O Ports: USB-A, USB-C, Audio -->
    <g fill="#475569">
      <rect x="155" y="112" width="10" height="5" rx="1"/>
      <rect x="175" y="112" width="10" height="5" rx="1"/>
      <rect x="195" y="113" width="8" height="3" rx="1.5"/>
      <circle cx="220" cy="114.5" r="3" fill="#334155" stroke="#64748b" stroke-width="1"/>
      <circle cx="235" cy="114.5" r="3" fill="#334155" stroke="#64748b" stroke-width="1"/>
    </g>
    <!-- HP Ribbed Mesh Grille -->
    <g stroke="#1e293b" stroke-width="2">
      <line x1="145" y1="135" x2="255" y2="135"/>
      <line x1="145" y1="145" x2="255" y2="145"/>
      <line x1="145" y1="155" x2="255" y2="155"/>
      <line x1="145" y1="165" x2="255" y2="165"/>
      <line x1="145" y1="175" x2="255" y2="175"/>
      <line x1="145" y1="185" x2="255" y2="185"/>
      <line x1="145" y1="195" x2="255" y2="195"/>
      <line x1="145" y1="205" x2="255" y2="205"/>
      <line x1="145" y1="215" x2="255" y2="215"/>
    </g>
    <!-- HP Badge -->
    <circle cx="200" cy="235" r="10" fill="#1e293b" stroke="#94a3b8" stroke-width="1"/>
    <text x="200" y="238.5" font-family="sans-serif" font-size="9" font-weight="900" text-anchor="middle" fill="#cbd5e1">hp</text>
  </g>
</svg>