<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="kb_body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <ellipse cx="200" cy="260" rx="160" ry="14" fill="#0b1f5e" opacity="0.14"/>
  <g>
    <!-- Keyboard Body -->
    <polygon points="40,230 290,230 280,110 50,110" fill="url(#kb_body)" stroke="#475569" stroke-width="2" rx="6"/>
    <!-- Keys Grid -->
    <g fill="#0f172a" stroke="#1e293b" stroke-width="0.5">
      <!-- Function Keys -->
      <rect x="58" y="118" width="210" height="10" rx="2"/>
      <!-- Alpha Keys 1 -->
      <rect x="58" y="134" width="210" height="14" rx="2"/>
      <!-- Alpha Keys 2 -->
      <rect x="58" y="152" width="210" height="14" rx="2"/>
      <!-- Alpha Keys 3 -->
      <rect x="58" y="170" width="210" height="14" rx="2"/>
      <!-- Spacebar & Bottom Row -->
      <rect x="58" y="188" width="210" height="18" rx="2"/>
      <!-- Numpad section -->
      <rect x="225" y="134" width="43" height="72" rx="2" fill="#090d16"/>
    </g>
    <text x="170" y="222" font-family="sans-serif" font-size="8" font-weight="800" fill="#94a3b8" letter-spacing="1">logitech</text>
    
    <!-- Wireless Mouse -->
    <ellipse cx="335" cy="180" rx="30" ry="48" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <!-- Mouse Click Divider -->
    <line x1="335" y1="135" x2="335" y2="175" stroke="#475569" stroke-width="1.5"/>
    <line x1="310" y1="175" x2="360" y2="175" stroke="#475569" stroke-width="1.5"/>
    <!-- Scroll Wheel with teal accent -->
    <rect x="331" y="150" width="8" height="18" rx="3" fill="#06b6d4"/>
    <text x="335" y="215" font-family="sans-serif" font-size="6" font-weight="800" fill="#64748b" text-anchor="middle">logi</text>
    <!-- Wireless USB Dongle -->
    <rect x="300" y="240" width="16" height="10" rx="2" fill="#cbd5e1" stroke="#475569" stroke-width="1"/>
    <rect x="303" y="235" width="10" height="5" fill="#f59e0b"/>
  </g>
</svg>