<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="dvr_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <ellipse cx="200" cy="265" rx="150" ry="12" fill="#0b1f5e" opacity="0.16"/>
  <g>
    <!-- Main 1U DVR Chassis -->
    <rect x="50" y="90" width="300" height="150" rx="8" fill="url(#dvr_grad)" stroke="#475569" stroke-width="2"/>
    <!-- Front Bezel Line -->
    <line x1="50" y1="130" x2="350" y2="130" stroke="#334155" stroke-width="1.5"/>
    <!-- Brand Label -->
    <text x="80" y="117" font-family="sans-serif" font-size="14" font-weight="900" fill="#dc2626" letter-spacing="1">HIKVISION</text>
    <text x="180" y="116" font-family="sans-serif" font-size="8" font-weight="700" fill="#94a3b8">4-CH TURBO HD DVR</text>
    <!-- Status LEDs: Power, HDD, TX/RX -->
    <g>
      <circle cx="280" cy="115" r="3.5" fill="#22c55e"/>
      <text x="280" y="125" font-family="sans-serif" font-size="5" font-weight="700" fill="#94a3b8" text-anchor="middle">PWR</text>
      <circle cx="300" cy="115" r="3.5" fill="#f59e0b"/>
      <text x="300" y="125" font-family="sans-serif" font-size="5" font-weight="700" fill="#94a3b8" text-anchor="middle">HDD</text>
      <circle cx="320" cy="115" r="3.5" fill="#38bdf8"/>
      <text x="320" y="125" font-family="sans-serif" font-size="5" font-weight="700" fill="#94a3b8" text-anchor="middle">NET</text>
    </g>
    <!-- Front USB Port -->
    <rect x="80" y="155" width="16" height="8" rx="1.5" fill="#020617" stroke="#475569" stroke-width="1"/>
    <!-- Cooling Ventilation Slots -->
    <g stroke="#334155" stroke-width="2">
      <line x1="120" y1="160" x2="320" y2="160"/>
      <line x1="120" y1="172" x2="320" y2="172"/>
      <line x1="120" y1="184" x2="320" y2="184"/>
      <line x1="120" y1="196" x2="320" y2="196"/>
    </g>
    <rect x="75" y="210" width="250" height="18" rx="3" fill="#020617"/>
    <text x="200" y="222" font-family="sans-serif" font-size="8" font-weight="700" fill="#38bdf8" text-anchor="middle">H.265+ Compression · 1080P Full HD Video Output</text>
  </g>
</svg>