<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="oled_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="25%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#d946ef"/>
      <stop offset="75%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="asus_shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0b1f5e" flood-opacity="0.22"/>
    </filter>
  </defs>
  <ellipse cx="200" cy="265" rx="160" ry="14" fill="#0b1f5e" opacity="0.14"/>
  <g filter="url(#asus_shadow)">
    <rect x="70" y="35" width="260" height="170" rx="8" fill="#090d16" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="75" y="40" width="250" height="160" rx="5" fill="#020617"/>
    <!-- Vivid OLED Display -->
    <rect x="80" y="50" width="240" height="144" rx="3" fill="url(#oled_grad)"/>
    <!-- OLED Badge on chin -->
    <text x="200" y="200" font-family="sans-serif" font-size="6" font-weight="800" text-anchor="middle" fill="#38bdf8" letter-spacing="1">ASUS Vivobook OLED</text>
    <!-- Base -->
    <polygon points="35,248 365,248 335,202 65,202" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <polygon points="75,232 325,232 312,206 88,206" fill="#020617"/>
    <!-- Keyboard with subtle backlight -->
    <g fill="#1e293b" stroke="#38bdf8" stroke-width="0.3">
      <rect x="90" y="209" width="220" height="4" rx="1"/>
      <rect x="88" y="215" width="224" height="5" rx="1"/>
      <rect x="84" y="222" width="232" height="6" rx="1"/>
    </g>
    <!-- NumberPad on Touchpad -->
    <rect x="165" y="235" width="70" height="10" rx="2" fill="#1e293b" stroke="#38bdf8" stroke-width="0.8"/>
    <path d="M35 248 L365 248 C365 253 355 256 345 256 L55 256 C45 256 35 253 35 248 Z" fill="#090d16"/>
  </g>
</svg>