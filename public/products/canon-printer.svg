<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="canon_body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="print_shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0b1f5e" flood-opacity="0.2"/>
    </filter>
  </defs>
  <ellipse cx="200" cy="265" rx="150" ry="14" fill="#0b1f5e" opacity="0.16"/>
  <g filter="url(#print_shadow)">
    <!-- Rear Paper Feed Tray -->
    <polygon points="100,50 300,50 285,110 115,110" fill="#334155" stroke="#475569" stroke-width="1.5"/>
    <rect x="125" y="40" width="150" height="40" rx="3" fill="#ffffff" opacity="0.9" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Main Printer Body -->
    <rect x="65" y="100" width="270" height="145" rx="10" fill="url(#canon_body)" stroke="#334155" stroke-width="2"/>
    <!-- Scanner Lid / Glass Top -->
    <rect x="75" y="105" width="250" height="25" rx="4" fill="#334155" stroke="#64748b" stroke-width="1"/>
    <!-- Canon Red Logo -->
    <text x="95" y="122" font-family="sans-serif" font-size="12" font-weight="900" fill="#dc2626" letter-spacing="1">Canon</text>
    <text x="145" y="122" font-family="sans-serif" font-size="8" font-weight="700" fill="#94a3b8">PIXMA G3770</text>
    <!-- Control Panel with LCD screen and buttons -->
    <rect x="250" y="138" width="70" height="40" rx="4" fill="#020617" stroke="#475569" stroke-width="1"/>
    <rect x="255" y="143" width="28" height="15" rx="2" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="269" y="153" font-family="sans-serif" font-size="6" font-weight="700" fill="#34d399" text-anchor="middle">READY</text>
    <circle cx="295" cy="150" r="4" fill="#22c55e"/>
    <circle cx="308" cy="150" r="4" fill="#ef4444"/>
    <!-- Front Paper Output Tray (Extended) -->
    <rect x="110" y="145" width="130" height="55" rx="4" fill="#090d16" stroke="#1e293b" stroke-width="1.5"/>
    <!-- Output paper sheet -->
    <rect x="120" y="175" width="110" height="40" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Visible Front Integrated Ink Tanks (Barak Valley favorites!) -->
    <!-- Black Tank (Left) -->
    <rect x="75" y="190" width="28" height="45" rx="4" fill="#020617" stroke="#334155" stroke-width="1.5"/>
    <rect x="78" y="200" width="22" height="32" rx="2" fill="#18181b"/>
    <text x="89" y="198" font-family="sans-serif" font-size="7" font-weight="800" fill="#cbd5e1" text-anchor="middle">GI-71P</text>
    <!-- Color Tanks (Right: Cyan, Magenta, Yellow) -->
    <g>
      <rect x="248" y="190" width="75" height="45" rx="4" fill="#020617" stroke="#334155" stroke-width="1.5"/>
      <!-- Cyan -->
      <rect x="252" y="200" width="20" height="32" rx="2" fill="#0284c7" opacity="0.9"/>
      <!-- Magenta -->
      <rect x="276" y="200" width="20" height="32" rx="2" fill="#e11d48" opacity="0.9"/>
      <!-- Yellow -->
      <rect x="300" y="200" width="19" height="32" rx="2" fill="#eab308" opacity="0.9"/>
    </g>
  </g>
</svg>