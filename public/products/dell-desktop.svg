<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="vostro_body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <ellipse cx="200" cy="270" rx="100" ry="12" fill="#0b1f5e" opacity="0.18"/>
  <g>
    <!-- Slim SFF Chassis -->
    <rect x="145" y="35" width="110" height="230" rx="6" fill="url(#vostro_body)" stroke="#475569" stroke-width="2"/>
    <!-- Triangular Mesh Grille Texture -->
    <path d="M155 45 L245 45 L245 130 L155 130 Z" fill="#020617"/>
    <!-- Power Button -->
    <circle cx="200" cy="150" r="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Ports -->
    <rect x="180" y="170" width="12" height="6" rx="1" fill="#475569"/>
    <rect x="208" y="170" width="12" height="6" rx="1" fill="#475569"/>
    <rect x="180" y="185" width="12" height="6" rx="1" fill="#475569"/>
    <circle cx="214" cy="188" r="3" fill="#334155" stroke="#64748b" stroke-width="1"/>
    <!-- Dell Round Emblem -->
    <circle cx="200" cy="230" r="14" fill="#0284c7" stroke="#ffffff" stroke-width="1.5"/>
    <text x="200" y="235" font-family="sans-serif" font-size="9" font-weight="900" text-anchor="middle" fill="#fff">DELL</text>
  </g>
</svg>